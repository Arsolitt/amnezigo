name: Feature request
description: Suggest an idea or an improvement for amnezigo
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that amnezigo does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other designs you have considered.
    validations:
      required: false
